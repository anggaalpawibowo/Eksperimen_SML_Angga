name: Automated Data Preprocessing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  preprocess-data:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengunduh kode dari repositori ke server GitHub Actions
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Menyiapkan lingkungan Python versi 3.10
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Menginstal pustaka yang dibutuhkan pipa data Anda
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn

    # 4. Mengeksekusi skrip otomatisasi Anda
    - name: Run Preprocessing Script
      run: |
        python automate_angga.py

    # 5. Mengompresi hasil dan melakukan push balik ke repositori
    - name: Compress and Push Cleaned Data
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        
        # Memeriksa apakah berkas hasil preprocessing terbentuk
        if [ -f "namadataset_preprocessing/cleaned_customer_churn.csv" ]; then
          echo "Mengompresi dataset steril menjadi format .zip..."
          
          # Masuk ke direktori output dan kompres file csv menjadi zip
          cd namadataset_preprocessing
          zip -r cleaned_customer_churn.zip cleaned_customer_churn.csv
          
          # Hapus file CSV mentah di server Actions agar tidak ikut ter-commit standar
          rm cleaned_customer_churn.csv
          cd ..
          
          # Tambahkan file .zip ke git tracker
          git add namadataset_preprocessing/cleaned_customer_churn.zip
          git commit -m "Automated update: compressed cleaned dataset via GitHub Actions [skip ci]"
          git push
        else
          echo "Berkas dataset tidak ditemukan."
        fi
